<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnSpec — GCSE and A-Level revision</title>
    <meta name="description" content="Official past papers and exam questions for GCSE and A-Level, filtered to the topics you have learned, with timed tests and progress tracking." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Crect x='6' y='19' width='20' height='6' fill='%23ffe36e'/%3E%3Cpath d='M9 16l5 5 9-11' fill='none' stroke='%23fcfcfb' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Stamp the theme before first paint (no flash). Preference: 'light' | 'dark' | 'system'.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('onspec:theme') || 'system';
        } catch (error) {}
        var dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
  </head>
  <body>
    <div id="app">
      <div class="loading" role="status"><span class="loading__spinner" aria-hidden="true"></span>Loading…</div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">This site needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
