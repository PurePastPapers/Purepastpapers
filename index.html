<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PurePastPapers</title>
    <meta name="description" content="Official past papers for your subjects, practice that only uses topics you have learned, and a Data Hub that shows how you are doing. GCSE, A-Level and Level 3." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20x%3D%276%27%20y%3D%276%27%20width%3D%2754%27%20height%3D%2754%27%20rx%3D%278%27%20fill%3D%27%232a2723%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%2754%27%20height%3D%2754%27%20rx%3D%278%27%20fill%3D%27%23fffdf8%27%20stroke%3D%27%232a2723%27%20stroke-width%3D%274%27%2F%3E%3Ctext%20x%3D%2729%27%20y%3D%2741%27%20text-anchor%3D%27middle%27%20fill%3D%27%232a2723%27%20font-family%3D%27Georgia%2Cserif%27%20font-size%3D%2730%27%3EP%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <script>
      // Stamp the theme before first paint (no flash). Preference: 'light' | 'dark' | 'system'.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('onspec:theme') || 'system';
        } catch (error) {}
        var dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        try {
          if (localStorage.getItem('onspec:flat') === '1') document.documentElement.setAttribute('data-flat', '');
          if (localStorage.getItem('onspec:large') === '1') document.documentElement.setAttribute('data-large', '');
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
    <link rel="stylesheet" href="css/paper.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <div id="app">
      <div class="loading" role="status"><span class="loading__spinner" aria-hidden="true"></span>Loading…</div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">This site needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
