<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe7" />
    <title>Finishing sign in · PurePastPapers</title>
    <style>
      :root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; color: #292722; background: #f4efe7; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #d7cfbf; border-radius: 18px; background: #fffdf8; box-shadow: 0 12px 40px #34281715; }
      h1 { margin: 0 0 10px; font-size: 1.4rem; } p { margin: 0; color: #635e54; }
      a { display: inline-block; margin-top: 18px; color: #4e694b; }
      [hidden] { display: none !important; }
      small { display: block; margin-top: 10px; font-size: 0.88rem; }
      #actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
      #actions a { margin: 0; padding: 10px 18px; border: 2px solid #292722; border-radius: 8px; color: #292722; font-weight: 650; text-decoration: none; box-shadow: 2px 2px 0 #292722; }
      #actions a.primary { background: #292722; color: #fffdf8; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="status">Finishing sign in…</h1>
      <p id="detail">Please keep this page open for a moment.</p>
      <div id="actions"></div>
      <a id="return" href="https://purepastpapers.com/">Return to PurePastPapers</a>
    </main>
    <script type="module" src="./js/auth-callback.js"></script>
  </body>
</html>
