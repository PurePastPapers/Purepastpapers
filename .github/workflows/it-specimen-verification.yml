name: IT specimen release verification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: node --test tests/it-bank.test.mjs tests/paper-labels.test.mjs tests/site-size.test.mjs
      - run: |
          node tools/serve.mjs 5196 &
          AUDIT_URL=http://localhost:5196 node tools/browser-it-bank.cjs
      - run: npm test
