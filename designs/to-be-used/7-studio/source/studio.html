/* tabs */
.tabs{display:flex;gap:0;margin-top:26px;border:2px solid var(--ink);border-radius:6px;width:max-content;background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.tabs>span{font-family:var(--hf);font-size:17px;padding:10px 20px;border-right:2px solid var(--ink);display:flex;gap:8px;align-items:center}.tabs>span:last-child{border-right:0}.tabs .on{background:var(--ink);color:var(--card)}
.tabs em{font-style:normal;font-family:'Nunito';font-size:12px;font-weight:800;border:1.5px solid currentColor;border-radius:20px;padding:0 7px}
/* forms */
.f{display:flex;flex-direction:column;gap:6px;margin-top:16px}.f>label{font-size:14px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}.f>label small{font-weight:600;color:var(--mut);font-size:12.5px}
.in{border:2px solid var(--ink);border-radius:6px;background:#fff;padding:10px 14px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;min-height:46px}

.g4{display:grid;grid-template-columns:1.7fr 1.25fr .75fr .6fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mode{display:flex;border:2px solid var(--ink);border-radius:6px;width:max-content;background:var(--card);box-shadow:3px 3px 0 var(--ink);flex-wrap:wrap}

.tog.off{background:var(--card)}.tog.off::after{right:auto;left:2px;background:#bdb5a8;border:0}

.spec .pt{display:flex;gap:10px;align-items:center;padding:5px 12px;font-size:14.5px}.spec .pt .chk{width:18px;height:18px;font-size:11px}.spec .pt.on{background:#eef5fb}.spec .pt .mono{color:var(--mut);font-size:12px;width:34px}

/* cards */
.ac{padding:26px 30px 26px}.ac h2{font-size:27px;display:flex;align-items:center;gap:12px}.ac .sub{font-size:14.5px;color:var(--mut);margin-top:4px}

.store{margin-top:16px;font-size:14.5px;border:1.5px dashed var(--ink);border-radius:5px;padding:9px 12px;background:#f7efd9;line-height:1.45}

.dim .card{box-shadow:4px 5px 0 rgba(0,0,0,.28)}.dim .btn,.dim .sbtn,.dim .mode,.dim .tabs,.dim .logo b,.dim .act{box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.dim .in,.dim .ta,.dim .spec,.dim .abox,.dim .gb{background:#3f3a34}.dim .gb .h{background:#4a443d}.dim .spec .pt.on{background:#5a5045}.dim .in.pl,.dim .abox,.dim .spec .srch{color:#8f8576}
.dim .store{background:#544b3c}.dim .store.err{background:#6a3f37;border-color:#c77a6e}.dim .store.ok{background:#45594a}

</style></head><body>
<div id="app"></div>
<script>
const P=new URLSearchParams(location.search),S=P.get('s')||'home',AI=!!P.get('ai'),DIM=!!P.get('dim');if(DIM)document.documentElement.classList.add('dim');
const st=t=>`<span class="st">${t}</span>`, sg=`<span class="sug">SUGGESTION</span>`;
const C={ma:'#9cc3e6',fm:'#c7b5ea',ph:'#f3a37f',bi:'#8fcaa0',ch:'#c7b5ea',en:'#f2a7c3',hi:'#d9c2a0',ge:'#b5cf8a'};
const topBar=`<div class="top"><div class="logo px"><b>P</b>PurePastPapers</div><div class="nav"><span>Home</span><span>Past papers</span><span>Practice</span><span>Data Hub</span></div><div class="r"><span class="tag">Owner account</span><div class="av on" style="background:${DIM?'#7f93a8':'#9cc3e6'}">O</div></div></div>`;
const head=(tab,title,lede,acts='')=>topBar+`<div class="crumb">Home / Account / Content Studio${title!=='Content Studio'?' / '+title:''}</div>
 <div class="hrow"><div><h1 class="px">${title}</h1><div class="hand lede">${lede}</div></div><div class="acts">${acts}</div></div>
 <div class="tabs">${[['home','Overview'],['add','Add a question'],['paper','Add a paper'],['pack','Content pack',AI?'14':'8'],['check','Database check']].map(([k,l,n])=>`<span class="${k===tab?'on':''}">${l}${n?`<em>${n}</em>`:''}</span>`).join('')}</div>`;
const saved=`<span class="hint" style="font-size:14px">Draft saved to your account · synced just now</span>`;
let h='';

/* ---------- OVERVIEW ---------- */
if(S==='home'){
 h=head('home','Content Studio','for the site owner · check the database and add new questions and papers',saved)+`
 <div class="home"><div class="col">
  <div class="card ruled ac r1"><i class="t tl"></i><h2 class="px">Add content</h2><div class="sub">New items go into your content pack first, so you can try them before anyone else sees them.</div>
   <div class="acts3">
    <div class="act"><span class="ic">+</span><b>Add a question</b><span>One question, its marks, spec points and mark scheme.</span></div>
    <div class="act"><span class="ic">P</span><b>Add a paper ${sg}</b><span>A whole paper: PDF links, timing and grade boundaries.</span></div>
    <div class="act"><span class="ic">&#8595;</span><b>Import a pack</b><span>Load a content pack file someone sent you.</span></div>
   </div></div>
  <div class="card ruled ac r2"><i class="t tc"></i><h2 class="px">Your content pack</h2><div class="sub">Not on the site yet. Only you can see these in Practice and Past papers.</div>
   <div class="facts">
    <div class="fact"><span class="v">${AI?11:7}</span><span class="l">questions</span>${AI?`<div class="s">incl. 4 AI ${st('AI MADE')}</div>`:''}</div>
    <div class="fact"><span class="v">${AI?3:1}</span><span class="l">paper${AI?'s':''}</span>${AI?'<div class="s">incl. 2 AI</div>':''}</div>
    <div class="fact"><span class="v">0</span><span class="l">errors</span></div>
    <div class="fact"><span class="v">${AI?3:2}</span><span class="l">notes to check</span></div>
   </div>
   <div class="store">Saved to your owner account and synced across your devices. <b>Last change 20 minutes ago.</b></div>
   <div class="row"><span class="sbtn d">Open the pack</span><span class="sbtn">Export pack</span><span class="sbtn">Import pack</span></div></div>
  ${AI?`<div class="card ac aic r3"><h2 class="px">Waiting for your review ${st('AI MADE')} ${sg}</h2><div class="sub">AI content is only published after you've read it through and checked the answer.</div>
   ${[['Physics','ph','AI question','Projectile from a cliff, 5 marks','4 to review'],['Mathematics','ma','AI past paper','Paper 1 Pure, 100 marks','1 to review'],['Biology','bi','Predicted paper','June 2027 Paper 2','1 to review']].map(([n,c,t,d,p])=>`<div class="li"><i class="cdot" style="background:${C[c]}"></i><div class="tx">${n} · ${t}<small>${d}</small></div><span class="pill warn">${p}</span><span class="sbtn">Review</span></div>`).join('')}
  </div>`:''}
 </div><div class="col">
  <div class="card ruled ac r2"><i class="t tr"></i><h2 class="px">Database health</h2><div class="sub">Last checked today at 17:42, across all 38 subjects.</div>
   <div class="facts">
    <div class="fact"><span class="v">926</span><span class="l">papers</span></div>
    <div class="fact"><span class="v">249</span><span class="l">demo questions</span></div>
    <div class="fact"><span class="v" style="color:${DIM?'#a8cfae':'#3c7a4a'}">0</span><span class="l">errors</span></div>
    <div class="fact"><span class="v">12</span><span class="l">warnings</span></div>
   </div>
   ${AI?`<div class="store" style="background:var(--card)">${st('AI MADE')}&nbsp; 3,410 AI questions, 76 AI papers and 38 predicted papers checked. All tagged as AI.</div>`:''}
   <div class="row"><span class="sbtn d">Check all subjects again</span><span class="sbtn">See the warnings</span></div></div>
  <div class="card ruled ac r4"><i class="t tc"></i><h2 class="px">Real content so far ${sg}</h2><div class="sub">How much of each subject has official questions, not just demo ones.</div>
   ${[['Physics','ph',62,'186 official · 20 demo'],['Mathematics','ma',48,'140 official · 31 demo'],['Chemistry','ch',21,'54 official · 28 demo'],['Biology','bi',9,'22 official · 30 demo'],['History','hi',0,'demo only']].map(([n,c,p,d])=>`<div class="li"><i class="cdot" style="background:${C[c]}"></i><div class="tx">${n}<small>${d}</small></div><div class="bar"><i style="width:${p}%;background:${C[c]}"></i></div><span style="width:40px;text-align:right">${p}%</span></div>`).join('')}
   <div class="hint" style="margin-top:8px">Demo questions are removed from a subject once its real content is in.</div></div>
  <div class="store" style="margin-top:-14px;font-size:14px">Question papers are the copyright of their exam boards. Only add material you are allowed to use.</div>
 </div></div>`;
}

/* ---------- ADD A QUESTION ---------- */
if(S==='add'||S==='bad'){
 const B=S==='bad';
 const pts=[['Topic 6: Further mechanics',[['6.79','Impulse is the change of momentum',1],['6.80','Momentum is conserved in collisions',1],['6.81','Elastic and inelastic collisions',!B],['6.82','Kinetic energy of a non-relativistic particle',0]]],['Topic 2: Mechanics',[['2.15','Newton\'s second law, F = ma',0]]]];
 h=head('add','Add a question','one question at a time, with its mark scheme',saved)+`
 <div class="cols"><div class="col">
  <div class="card ruled ac r3"><i class="t tl"></i><h2 class="px">Where it's from</h2>
   <div class="g4"><div class="f"><label>Subject</label><div class="in"><i class="cdot" style="background:${C.ph}"></i>A-Level Physics · Edexcel 9PH0<span class="cv">&#9660;</span></div></div>
    <div class="f"><label>Paper</label><div class="in">${AI?'None · AI question bank':'June 2024 · Paper 1'}<span class="cv">&#9660;</span></div></div>
    <div class="f"><label>${AI?'Number':'Question number'}</label><div class="in ${B?'bad':''}">${AI?'412':'7'}</div>${B?'<span class="hint bad">Question 7 is already in this paper.</span>':''}</div>
    <div class="f"><label>Marks</label><div class="in">6</div></div></div>
