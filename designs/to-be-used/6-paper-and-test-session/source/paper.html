const Qs=[
 [1,'Given that f(x) = x³ − 3x² − 4x + 12, use the factor theorem to show that (x − 2) is a factor of f(x).','Algebra and functions','e',4,'G','4/4'],
 [2,'Solve, for 0 ≤ θ < 360°, the equation 2 sin²θ − cos θ = 1, giving your answers to 1 decimal place.','Trigonometry','m',5,'A','3/5'],
 [3,'The first term of a geometric series is 20 and the common ratio is 0.8. Find the sum to infinity.','Sequences and series','e',3,'',''],

<div style="margin-top:14px"><span class="sync"><i></i>Saved to your account</span></div></div>`;
