</style></head><body>
<div class="top"><div class="logo px"><b>P</b>PurePastPapers</div><div class="nav"><span>Home</span><span>Past papers</span><span>Practice</span><span>Data Hub</span></div><div class="r"><span class="tag" id="ans">214 answered</span><div class="av">D</div></div></div>
<div id="app"></div>
<script>
const P=new URLSearchParams(location.search),S=P.get('s')||'list',AI=!!P.get('ai');
if(S==='subject')document.body.classList.add('tint');
if(S==='empty')document.getElementById('ans').textContent='0 answered';
const st=t=>`<span class="st">${t}</span>`;
const PAL=['#9cc3e6','#c7b5ea','#f3a37f','#8fcaa0','#f4cf6a','#f2a7c3','#9fd6cf','#d9c2a0','#b5cf8a','#e9b8e6','#c9ccd3'];
const mine=[
 {n:'Mathematics',c:'#9cc3e6',lv:'A-Level',b:'Edexcel 9MA0',t:'A',l:76,of:90,seg:'GGGAARWW',last:'B',lr:'A',ai:386,pp:2,r:'r1'},
 {n:'Further Maths',c:'#c7b5ea',lv:'A-Level',b:'Edexcel 9FM0',t:'B',l:16,of:103,seg:'GAWWWWWW',last:'A',lr:'X',ai:142,pp:1,r:'r2'},
 {n:'Physics',c:'#f3a37f',lv:'A-Level',b:'Edexcel 9PH0',t:'A*',l:48,of:121,seg:'GGAWWWWW',last:'C',lr:'R',ai:254,pp:2,r:'r3'},
 {n:'Geography',c:'#8fcaa0',lv:'A-Level',b:'AQA 7037',t:'B',l:30,of:56,seg:'GGARWWWW',last:'B',lr:'G',ai:118,pp:1,r:'r4'}];
const SC={G:'#8fcaa0',A:'#f4cf6a',R:'#ef9a8f',W:'var(--card)'};
const BL={X:'Exceeding target',G:'Secure',A:'Developing',R:'Needs work'};
const band=(k,txt)=>!k?'':`<span class="rg ${k}">${txt||BL[k]}</span>`;
const subjCard=(s,o={})=>`<div class="card sc ${s.r}">
 <div class="hd" style="background:${s.c}"><h3 class="px">${s.n}</h3><i class="cdot" style="background:${s.c}"></i></div>
 <div class="bd"><div class="meta">${s.lv} · ${s.b}</div>
 <div class="tgt"><span class="gb">${s.t}</span><div><span class="l">Target grade</span>Last paper: <b>${s.last}</b> ${band(s.lr)}</div></div>
 <div class="seg">${[...s.seg].map(k=>`<i style="background:${SC[k]}"></i>`).join('')}</div>
 <div class="meta">${s.l}/${s.of} spec points learned</div>
 ${AI?`<div class="ailine">${st('AI MADE')} <span>${s.ai} questions · ${s.pp} predicted paper${s.pp>1?'s':''}</span></div>`:''}
 <div class="row"><span class="sbtn d">Topics learned</span><span class="sbtn">Edit</span><span class="lnk">Remove</span></div></div></div>`;

const catA=[
 {cat:'Maths',n:'Mathematics',code:'Edexcel · 9MA0',nt:'Pure, Statistics and Mechanics. Three 2-hour papers.',p:42,q:180,ai:386,on:1},
 {cat:'Maths',n:'Further Mathematics',code:'Edexcel · 9FM0',nt:'Core Pure plus two options (Further Stats and Mechanics).',p:36,q:120,ai:142,on:1},
 {cat:'Science',n:'Biology',code:'Edexcel · 9BN0',nt:'Biology B. Three papers, including a practical skills paper.',p:30,q:96,ai:220},
 {cat:'Science',n:'Chemistry',code:'OCR · H432',nt:'Chemistry A. Three papers: periodic table, organic, unified.',p:30,q:104,ai:240},
 {cat:'Science',n:'Physics',code:'Edexcel · 9PH0',nt:'Three papers. Paper 3 covers general and practical principles.',p:30,q:121,ai:254,on:1},
 {cat:'Art',n:'Art & Design: Fine Art',code:'AQA · 7202',nt:'Personal investigation and an externally set assignment.',noexam:1},
];
const catG=[
 {cat:'Maths',n:'Mathematics',code:'Edexcel · 1MA1',nt:'Foundation and Higher tiers. Three papers, one non-calculator.',p:54,q:240,ai:510},
 {cat:'Science',n:'Combined Science',code:'Edexcel · 1SC0',nt:'Double Award. Six papers: Biology, Chemistry, Physics 1 and 2.',p:72,q:260,ai:480},
 {cat:'Science',n:'Physics',code:'Edexcel · 1PH0',nt:'Triple Science. Paper 1 Topics 1-7, Paper 2 Topics 1, 8-15.',p:24,q:130,ai:300},
 {cat:'English',n:'English Language',code:'AQA · 8700',nt:'Two papers: creative reading and writing, viewpoints.',p:20,q:60,ai:90},
 {cat:'Humanities',n:'History',code:'Edexcel · 1HI0',nt:'Three papers across thematic, period and modern depth studies.',p:30,q:84,ai:140},
 {cat:'Art',n:'Art & Design',code:'AQA · 8201',nt:'Portfolio and an externally set task.',noexam:1},
];
const catCard=(c,i)=>`<div class="card ruled cc ${['r2','r3','r1','r4','r1','r2'][i]}"><i class="t tc"></i>
 <div class="cat">${c.cat}</div><h3 class="px">${c.n}</h3><div class="code">${c.code}</div><div class="nt">${c.nt}</div>
 ${c.noexam?`<div class="warn">No written exam, so there are no papers or questions to practise. You can still add it to keep your subjects together.</div>`:
 `<div class="cnt"><span><b>${c.p}</b> past papers</span><span><b>${c.q}</b> questions</span>${AI?`<span><b>${c.ai}</b> AI questions ${st('AI MADE')}</span>`:''}</div>`}
 <div class="row">${c.on?`<span class="sbtn added">&#10003; Added</span>`:`<span class="sbtn d">+ Add subject</span>`}<span class="sbtn">View topics</span></div></div>`;
const SUG=[['Chemistry','OCR · H432','often taken with Maths and Physics, and shares some of their topics','r2'],['Computer Science','OCR · H446','uses a lot of the maths you already study','r3'],['Biology','Edexcel · 9BN0','its fieldwork and statistics overlap with Geography','r1']];
const sugRow=AI=>`<div class="suglab"><h3 class="px">Suggested for you</h3><span class="hand">based on Mathematics, Further Maths, Physics and Geography</span></div><div class="sug">${SUG.map(([n,c,w,r])=>`<div class="card sg ${r}"><h3 class="px">${n}</h3><span class="sbtn d">+ Add</span><span class="code">A-Level · ${c}</span><span class="why hand">${w}</span></div>`).join('')}</div>`;
const catalogue=(lvl,cards,hint)=>`<section><div class="sec"><h2 class="px">Add subjects</h2><span class="hand">${hint}</span></div>${S==='list'?sugRow():''}
 <div class="ctl"><div class="mode">${['GCSE','A-Level','Level 3'].map(t=>`<span class="${t===lvl?'on':''}">${t}</span>`).join('')}</div>
 <div class="search">&#9906;&nbsp; Search subjects or spec codes</div>
 <div class="chips" style="margin-left:auto"><span class="tag on">All</span><span class="tag">Maths</span><span class="tag">Science</span><span class="tag">English</span><span class="tag">Humanities</span><span class="tag">Languages</span><span class="tag">Creative</span></div></div>
 <div class="grid3">${cards.map(catCard).join('')}</div></section>`;

let h='';
/* ---------- list / setup ---------- */
if(S==='list'||S==='setup'){
 h=`<div class="crumb">Home &nbsp;/&nbsp; My subjects</div><div class="hrow"><div><h1 class="px">My subjects</h1><p class="lede hand">what you study, your target grades and the topics you've learned</p></div></div>
 <div class="main"><section><div class="sec"><h2 class="px">Studying now</h2><span class="hand">tap the dot to change a subject's colour</span></div>
 <div class="grid4">${mine.filter(s=>S!=='setup'||s.n!=='Physics').map(s=>subjCard(s)).join('')}</div></section>
 ${catalogue('A-Level',S==='setup'?catA.map(c=>c.n==='Physics'?{...c,on:0}:c):catA,'each one is matched to its exam board and specification')}</div>`;
 if(S==='setup'){
  const ph={n:'Physics',c:'#f3a37f',lv:'A-Level',b:'Edexcel 9PH0',t:'A',l:0,of:121,seg:'WWWWWWWW',last:'none yet',lr:'',ai:254,pp:2,r:''};
  h+=`<div class="veil"></div><div class="card ruled modal"><i class="t tl"></i><i class="t tr"></i>
  <h2 class="px">Add Physics</h2><div class="sub">A-Level · Edexcel 9PH0 · three papers. You can change all of this later.</div>
  <div class="mg"><div>
   <div class="fs"><h4><i>1</i>Pick a colour</h4><p class="h">Used for the subject's header, its tint and its charts.</p>
    <div class="sw">${PAL.map(c=>`<i class="${c==='#f3a37f'?'on':''}" style="background:${c}"></i>`).join('')}</div></div>
